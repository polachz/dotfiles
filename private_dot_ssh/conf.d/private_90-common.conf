# Ghostty sets TERM=xterm-ghostty; remote machines without a matching
# terminfo entry (typical minimal Linux VM/homelab server) fail with
# "missing or unsuitable terminal" on interactive programs (nano, vim, htop).
# `SetEnv` requires OpenSSH >=8.7 on the client. See CONCEPT_ROADMAP.md §2.4
# for why this is preferred over Ghostty's own ssh-terminfo integration
# (which only works for interactive `ssh` invocations, not cron/scp/rsync/mosh).
#
# Listed last (highest number = lowest precedence among our own fragments)
# so any more specific Host block above can still override it.
Host *
  SetEnv TERM=xterm-256color
