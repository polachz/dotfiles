# UTM lab test VMs for this dotfiles project (CONCEPT_ROADMAP.md §8) — mDNS
# hostnames, disposable/re-imaged often, hence no host-key pinning.
Host maclab
  HostName maclab.local
  User tester
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null

Host windev
  HostName windev.local
  User tester
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null
