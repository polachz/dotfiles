# Homelab SSH connections (personal profile only via *-personal-*.conf).
# Replace REPLACE_ME placeholders, then encrypt via:
#   chezmoi add --encrypt ~/.ssh/conf.d/50-personal-homelab.conf
# (and remove this plaintext template file from private_dot_ssh/conf.d/).

Host worker
  HostName worker.REPLACE_ME

Host cml ctx01 ctx02
  HostName %n.REPLACE_ME

Host worker cml ctx01 ctx02
  User REPLACE_ME
  IdentityFile ~/.ssh/homelab-personal-key.pub
  IdentitiesOnly yes
