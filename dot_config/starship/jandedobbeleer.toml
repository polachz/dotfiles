# Conversion of the Oh My Posh "jandedobbeleer" theme
# (github.com/JanDeDobbeleer/oh-my-posh/blob/main/themes/jandedobbeleer.omp.json)
# to Starship, 2026-08-17 — the OMP theme this project's original PowerShell
# profile intended to use first, before a second, later `oh-my-posh init`
# call for "atomic" silently overrode it (see atomic.toml).
#
# One of two alternate full presets (see also atomic.toml) — not composed
# with starship-common/personal/work like the default ~/.config/starship.toml.
# Switch to this one with `starship-theme jandedobbeleer` (sets
# $STARSHIP_CONFIG for the current shell session).
#
# Revised 2026-08-17 after live testing on macOS/fish and Windows/pwsh
# surfaced two real bugs in the first pass:
# - Powerline transition glyphs between modules were hardcoded as always
#   shown, even for modules that render nothing (git outside a repo, most of
#   the language modules outside a matching project dir, sudo with no
#   cached creds, battery on hardware without one). With this many mutually
#   optional modules chained together, there's no single fixed "previous
#   segment's color" a transition glyph can safely assume — unlike
#   atomic.toml's shorter, more linear layout, wrapping every affected pair
#   in a conditional group here would still leave un-fixable cases (e.g.
#   nodejs absent but golang present, or vice versa — the transition
#   between whichever two modules actually show can't be known upfront).
#   Kept powerline transitions only between username→directory (the only
#   two modules genuinely always both visible); everything after that
#   (git, each language, cmd_duration, status, battery, time) is a flat
#   colored "chip" with no connecting arrows instead. Less seamless than
#   the OMP original, but never shows a broken/orphaned transition
#   regardless of which subset of modules apply.
# - Several hand-picked Nerd Font codepoints for sudo/cmd_duration symbols
#   didn't render as intended (showed as an unrelated emoji or a tofu box
#   depending on platform) — replaced with plain, verified-safe characters,
#   or dropped. The `sudo` module was removed outright: it means "sudo
#   credentials are currently cached", not "running as root/elevated" like
#   OMP's root segment — the wrong concept even before the icon problem.
#   The `status` module's symbols were both empty strings in the first
#   pass (a copy-paste mistake) — it never showed anything at all, on
#   success or failure; given a real failure symbol now.
#
# Other known, unavoidable differences from the OMP original:
# - Starship module styles are static — can't swap a segment's BACKGROUND
#   color based on live state the way OMP's `background_templates` does
#   (git segment turning orange/purple on changes/ahead-behind, aws segment
#   color depending on which profile is active). git_status text color
#   still reflects state; segment backgrounds are fixed here.
# - No Starship equivalent for the "ytm" (YouTube Music now-playing) module
#   or Azure Functions detection — both dropped entirely, no substitute.
# - Uses Starship's own default per-language symbols rather than hand-porting
#   OMP's exact icon codepoints — both are Nerd Font glyphs, just not
#   byte-identical to the original theme.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#c386f1)$username[](fg:#c386f1 bg:#ff479c)$directory$git_branch$git_status$nodejs$golang$julia$python$ruby$aws$cmd_duration$status
"""

right_format = """
$battery$time
"""

[username]
show_always = true
style_user = "fg:#ffffff bg:#c386f1"
style_root = "fg:#ffffff bg:#c386f1"
format = "[ $user ]($style)"

[directory]
style = "fg:#ffffff bg:#ff479c"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
style = "fg:#193549 bg:#fffb38"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "fg:#193549 bg:#fffb38"
format = '([$all_status$ahead_behind ]($style))'

[nodejs]
style = "fg:#ffffff bg:#6CA35E"
format = "[ $symbol($version) ]($style)"

[golang]
style = "fg:#111111 bg:#8ED1F7"
format = "[ $symbol($version) ]($style)"

[julia]
style = "fg:#111111 bg:#4063D8"
format = "[ $symbol($version) ]($style)"

[python]
style = "fg:#111111 bg:#FFDE57"
format = '[ $symbol($version)(\($virtualenv\)) ]($style)'

[ruby]
style = "fg:#ffffff bg:#AE1401"
format = "[ $symbol($version) ]($style)"

[aws]
style = "fg:#ffffff bg:#FEAC19"
format = '[ $symbol($profile )(\($region\)) ]($style)'

[cmd_duration]
style = "fg:#ffffff bg:#83769c"
format = "[ ⏱ $duration ]($style)"
min_time = 0

[status]
disabled = false
style = "fg:#ffffff bg:#00897b"
format = "[ $symbol ]($style)"
symbol = "✖"
success_symbol = ""
map_symbol = true

[battery]
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 100
style = "fg:#ffffff bg:#f36943"

[time]
disabled = false
style = "fg:#ffffff bg:#2e9599"
format = "[ $time ]($style)"
