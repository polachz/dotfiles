# Conversion of the Oh My Posh "atomic" theme
# (github.com/JanDeDobbeleer/oh-my-posh/blob/main/themes/atomic.omp.json)
# to Starship, 2026-08-17 — this is the theme that was actually active in
# the user's old PowerShell profile (a second `oh-my-posh init` call for
# "jandedobbeleer" earlier in that file was silently overridden by this one).
#
# One of two alternate full presets (see also jandedobbeleer.toml) — not
# composed with starship-common/personal/work like the default
# ~/.config/starship.toml. Switch to this one with `starship-theme atomic`
# (sets $STARSHIP_CONFIG for the current shell session).
#
# Revised 2026-08-17 after live testing on macOS/fish and Windows/pwsh
# surfaced two real bugs in the first pass:
# - Powerline transition glyphs between modules were hardcoded as always
#   shown, even for modules that render nothing (sudo with no cached creds,
#   language modules outside a matching project dir, battery on hardware
#   without one, cmd_duration before any command has run yet in a new
#   session). Result: orphaned/doubled-up transition arrows with no content
#   between them. Fixed on the left prompt by wrapping both the git segment
#   and the cmd_duration segment (each with their own transitions) in their
#   own conditional `(...)` groups — shown only when they'd actually render
#   something. One known remaining seam: the leading transition into
#   cmd_duration's group assumes the git segment's yellow
#   transition into $cmd_duration assumes the git segment's yellow
#   background even when git didn't render (falls back to whatever
#   $directory's orange looks like behind it) — a real Starship limitation
#   (format strings can't ask "what did the previous segment render as").
#   The right-hand language/cloud icons dropped inter-segment transitions
#   entirely instead (flat colored chips, no connecting arrows) — with up
#   to a dozen mutually-optional modules there, no fixed transition color
#   is ever reliably correct.
# - Several hand-picked Nerd Font codepoints for sudo/cmd_duration/time/os
#   symbols didn't render as intended (showed as an unrelated emoji or a
#   tofu box depending on platform) — replaced with values verified against
#   Starship's own documented defaults/examples, or dropped. The `sudo`
#   module was removed outright: it means "sudo credentials are currently
#   cached", not "running as root/elevated" like OMP's root segment — the
#   wrong concept even before the icon problem.
#
# Other known, unavoidable differences from the OMP original:
# - Starship module styles are static — it can't swap a segment's
#   BACKGROUND color based on live state the way OMP's Go-template
#   `background_templates` does (e.g. atomic's git segment turning purple
#   on ahead/behind, orange on uncommitted changes). git_status text color
#   still reflects state; only the segment background is fixed here.
# - No Starship equivalent exists for: Angular, Nx, Azure Functions modules
#   (all OMP-only integrations) — dropped.
# - Node's "package manager icon" (npm/yarn detection) isn't a Starship
#   nodejs module feature — dropped, version only.
# - Uses Starship's own default per-language symbols rather than hand-porting
#   OMP's exact icon codepoints — both are Nerd Font glyphs, just not
#   byte-identical to the original theme.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:#0077c2)$shell[](fg:#0077c2 bg:#FF9248)$directory([](fg:#FF9248 bg:#FFFB38)$git_branch$git_status)([](fg:#FFFB38 bg:#83769c)$cmd_duration[](fg:#83769c))
$line_break\
[╰─](#21c7c7)([$status ](fg:#e0f8ff))$character"""

right_format = """
$nodejs$python$java$dotnet$golang$rust$dart$julia$ruby$aws$kubernetes$os$battery$time
"""

[shell]
disabled = false
format = "[ $indicator ]($style)"
style = "fg:#ffffff"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
powershell_indicator = "pwsh"

[directory]
style = "fg:#2d3436 bg:#FF9248"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"

[git_branch]
style = "fg:#011627 bg:#FFFB38"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "fg:#011627 bg:#FFFB38"
format = '([$all_status$ahead_behind ]($style))'

[cmd_duration]
style = "fg:#ffffff bg:#83769c"
format = "[ ⏱ $duration ]($style)"
min_time = 0

[character]
success_symbol = "[❯](#21c7c7)"
error_symbol = "[❯](#ef5350)"

[status]
disabled = false
format = "[$symbol$status]($style)"
symbol = "✖"
success_symbol = ""
style = "fg:#ef5350"

[nodejs]
style = "fg:#3C873A bg:#303030"
format = "[ $symbol($version) ]($style)"

[python]
style = "fg:#FFE873 bg:#306998"
format = '[ $symbol($version)(\($virtualenv\)) ]($style)'

[java]
style = "fg:#ffffff bg:#0e8ac8"
format = "[ $symbol($version) ]($style)"

[dotnet]
style = "fg:#0d6da8 bg:#0e0e0e"
format = "[ $symbol($version) ]($style)"

[golang]
style = "fg:#06aad5 bg:#ffffff"
format = "[ $symbol($version) ]($style)"

[rust]
style = "fg:#925837 bg:#f3f0ec"
format = "[ $symbol($version) ]($style)"

[dart]
style = "fg:#055b9c bg:#e1e8e9"
format = "[ $symbol($version) ]($style)"

[julia]
style = "fg:#359a25 bg:#945bb3"
format = "[ $symbol($version) ]($style)"

[ruby]
style = "fg:#9c1006 bg:#ffffff"
format = "[ $symbol($version) ]($style)"

[aws]
style = "fg:#faa029 bg:#565656"
format = '[ $symbol($profile )(\($region\)) ]($style)'

[kubernetes]
disabled = false
style = "fg:#ffffff bg:#316ce4"
format = '[ $symbol$context( \($namespace\)) ]($style)'

[os]
disabled = false
style = "fg:#222222 bg:#b2bec3"
format = "[ $symbol ]($style)"
# Default os.symbols (plain emoji: 🍎/🐧/🪟) are kept deliberately instead of
# custom Nerd Font codepoints — verified live that hand-picked PUA codepoints
# here rendered as broken/unrelated glyphs; the built-in emoji defaults need
# no font support beyond standard Unicode color emoji.

[battery]
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 100
style = "fg:#262626 bg:#f36943"

[time]
disabled = false
style = "fg:#ffffff bg:#40c4ff"
format = "[ 🕙 $time ]($style)"
time_format = "%_2d,%H:%M"
