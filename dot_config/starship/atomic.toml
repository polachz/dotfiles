# Conversion of the Oh My Posh "atomic" theme
# (github.com/JanDeDobbeleer/oh-my-posh/blob/main/themes/atomic.omp.json)
# to Starship, 2026-08-17 — this is the theme that was actually active in
# the user's old PowerShell profile (a second `oh-my-posh init` call for
# "jandedobbeleer" earlier in that file was silently overridden by this one).
#
# One of two alternate full presets (see also jandedobbeleer.toml) — not
# composed with starship-common/personal/work like the default
# ~/.config/starship.toml. Switch to this one with `starship-theme atomic`
# (sets $STARSHIP_CONFIG for the current shell session).
#
# Known, unavoidable differences from the OMP original:
# - Starship module styles are static — it can't swap a segment's
#   BACKGROUND color based on live state the way OMP's Go-template
#   `background_templates` does (e.g. atomic's git segment turning purple
#   on ahead/behind, orange on uncommitted changes). git_status text color
#   still reflects state; only the segment background is fixed here.
# - No Starship equivalent exists for: Angular, Nx, Azure Functions modules
#   (all OMP-only integrations) — dropped.
# - Node's "package manager icon" (npm/yarn detection) isn't a Starship
#   nodejs module feature — dropped, version only.
# - Uses Starship's own default per-language symbols rather than hand-porting
#   OMP's exact icon codepoints — both are Nerd Font glyphs, just not
#   byte-identical to the original theme.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg:#0077c2)$shell[](fg:#0077c2 bg:#ef5350)$sudo[](fg:#ef5350 bg:#FF9248)$directory[](fg:#FF9248 bg:#FFFB38)$git_branch$git_status[](fg:#FFFB38 bg:#83769c)$cmd_duration[](fg:#83769c)
$line_break\
[╰─](#21c7c7)[$status ](fg:#e0f8ff)$character"""

right_format = """
[](fg:#303030 bg:#303030)$nodejs[](fg:#303030 bg:#306998)$python[](fg:#306998 bg:#0e8ac8)$java[](fg:#0e8ac8 bg:#0e0e0e)$dotnet[](fg:#0e0e0e bg:#ffffff)$golang[](fg:#ffffff bg:#f3f0ec)$rust[](fg:#f3f0ec bg:#e1e8e9)$dart[](fg:#e1e8e9 bg:#945bb3)$julia[](fg:#945bb3 bg:#ffffff)$ruby[](fg:#ffffff bg:#565656)$aws[](fg:#565656 bg:#316ce4)$kubernetes[](fg:#316ce4 bg:#b2bec3)$os[](fg:#b2bec3 bg:#f36943)$battery[](fg:#f36943 bg:#40c4ff)$time[](fg:#40c4ff)
"""

[shell]
disabled = false
format = "[ $indicator ]($style)"
style = "fg:#ffffff"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
powershell_indicator = "pwsh"

[sudo]
disabled = false
format = "[ $symbol ]($style)"
symbol = "󰚌"
style = "fg:#FFFB38"

[directory]
style = "fg:#2d3436 bg:#FF9248"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"

[git_branch]
style = "fg:#011627 bg:#FFFB38"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "fg:#011627 bg:#FFFB38"
format = '([$all_status$ahead_behind ]($style))'

[cmd_duration]
style = "fg:#ffffff bg:#83769c"
format = "[ 󱦟 $duration ]($style)"
min_time = 0

[character]
success_symbol = "[❯](#21c7c7)"
error_symbol = "[❯](#ef5350)"

[status]
disabled = false
format = "[$symbol$status]($style)"
symbol = "✖"
success_symbol = ""
style = "fg:#ef5350"

[nodejs]
style = "fg:#3C873A bg:#303030"
format = "[ $symbol($version) ]($style)"

[python]
style = "fg:#FFE873 bg:#306998"
format = '[ $symbol($version)(\($virtualenv\)) ]($style)'

[java]
style = "fg:#ffffff bg:#0e8ac8"
format = "[ $symbol($version) ]($style)"

[dotnet]
style = "fg:#0d6da8 bg:#0e0e0e"
format = "[ $symbol($version) ]($style)"

[golang]
style = "fg:#06aad5 bg:#ffffff"
format = "[ $symbol($version) ]($style)"

[rust]
style = "fg:#925837 bg:#f3f0ec"
format = "[ $symbol($version) ]($style)"

[dart]
style = "fg:#055b9c bg:#e1e8e9"
format = "[ $symbol($version) ]($style)"

[julia]
style = "fg:#359a25 bg:#945bb3"
format = "[ $symbol($version) ]($style)"

[ruby]
style = "fg:#9c1006 bg:#ffffff"
format = "[ $symbol($version) ]($style)"

[aws]
style = "fg:#faa029 bg:#565656"
format = '[ $symbol($profile )(\($region\)) ]($style)'

[kubernetes]
disabled = false
style = "fg:#ffffff bg:#316ce4"
format = '[ $symbol$context( \($namespace\)) ]($style)'

[os]
disabled = false
style = "fg:#222222 bg:#b2bec3"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Windows = "󰍲"

[battery]
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 100
style = "fg:#262626 bg:#f36943"

[time]
disabled = false
style = "fg:#ffffff bg:#40c4ff"
format = "[ 󰥔 $time ]($style)"
time_format = "%_2d,%H:%M"
